<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SenangStart XR - Component Showcase</title>
  <meta name="description" content="A complete SenangStart XR component showcase for A-Frame and WebXR">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/senangstart-xr.js?v=20261004-glass"></script>
  <script src="js/glass-showcase.js?v=20261004-glass"></script>
  <style>
    body { margin: 0; background: #080D1C; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .gaze-setting {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      display: flex; align-items: center; gap: 9px;
      padding: 11px 16px; border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px; color: #D7E3F7; background: rgba(30, 42, 65, 0.48);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 8px 28px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
      font-size: 12px; letter-spacing: 0.01em; cursor: pointer;
    }
    .gaze-setting input { accent-color: #0A84FF; margin: 0; }
    .gaze-setting:focus-within { outline: 2px solid #91C7FF; outline-offset: 3px; }
    .desktop-hint { opacity: 0.65; }
    @media (max-width: 640px) {
      .gaze-setting { top: 12px; left: 12px; padding: 10px 13px; }
      .desktop-hint { display: none; }
    }
  </style>
  <script>
    const DEMO_FONT = '../Outfit-Regular.ttf';

    [
      ['sxr-button', 'fontFamily'],
      ['sxr-circle-loader', 'fontFamily'],
      ['sxr-circle-timer', 'fontFamily'],
      ['sxr-icon-label-button', 'fontFamily'],
      ['sxr-input', 'fontFamily'],
      ['sxr-label', 'fontFamily'],
      ['sxr-radio', 'fontFamily'],
      ['sxr-toggle', 'fontFamily']
    ].forEach(function ([componentName, propertyName]) {
      const component = AFRAME.components[componentName];
      if (component && component.schema && component.schema[propertyName]) {
        component.schema[propertyName].default = DEMO_FONT;
      }
    });

    const state = {
      clicks: 0,
      mode: 'Orbit',
      slider: 42,
      vertical: 68,
      progress: 0.64,
      timer: 12
    };

    function setStatus(message) {
      const status = document.querySelector('#statusText');
      if (status) {
        status.setAttribute('value', message);
      }
    }

    function setMetric(id, value) {
      const el = document.querySelector(id);
      if (el) {
        el.setAttribute('value', value);
      }
    }

    function onPrimaryClick() {
      state.clicks += 1;
      setMetric('#clickMetric', `Clicks ${state.clicks}`);
      setStatus(`Glass button pressed ${state.clicks} time${state.clicks === 1 ? '' : 's'}`);
    }

    function onBevelClick() {
      setStatus('Primary action activated');
    }

    function onIconClick() {
      setStatus('Icon button clicked');
    }

    function onIconLabelClick() {
      setStatus('Icon + label button clicked');
    }

    function onToggle() {
      state.mode = state.mode === 'Orbit' ? 'Inspect' : 'Orbit';
      setMetric('#modeMetric', `Mode ${state.mode}`);
      setStatus(`Toggle changed mode to ${state.mode}`);
    }

    function onRadioComfort() {
      setMetric('#radioMetric', 'Comfort selected');
      setStatus('Radio option selected: Comfort');
    }

    function onRadioFocus() {
      setMetric('#radioMetric', 'Focus selected');
      setStatus('Radio option selected: Focus');
    }

    function onInputClick() {
      setStatus('Input activated: type with your keyboard (Enter commits)');
    }

    function onInputEdit(evt) {
      setStatus(`Editing: ${evt.detail ? evt.detail.value : ''}`);
    }

    function onInputCommit(evt) {
      setStatus(`Input committed: "${evt.detail ? evt.detail.value : ''}"`);
    }

    function onSlide(_event, percent) {
      state.slider = Math.round(percent * 100);
      setMetric('#sliderMetric', `Horizontal ${state.slider}%`);
      setStatus(`Horizontal slider set to ${state.slider}%`);
    }

    function onVerticalSlide(percent) {
      state.vertical = Math.round(percent * 100);
      setMetric('#verticalMetric', `Vertical ${state.vertical}%`);
      setStatus(`Vertical slider set to ${state.vertical}%`);
    }

    function formatPercent(percent) {
      return `${Math.round(percent * 100)}%`;
    }

    function cycleProgress() {
      state.progress = state.progress >= 0.95 ? 0.12 : state.progress + 0.08;
      const loader = document.querySelector('#circleLoader');
      if (loader) {
        loader.setAttribute('loaded', state.progress.toFixed(2));
      }
      const progressBar = document.querySelector('#linearProgress');
      if (progressBar) {
        progressBar.setAttribute('percent', state.progress.toFixed(2));
      }
      setMetric('#progressMetric', `Progress ${Math.round(state.progress * 100)}%`);
    }

    function tickTimer() {
      const timer = document.querySelector('#circleTimer');
      const component = timer && timer.components && timer.components['sxr-circle-timer'];
      if (!component) {
        return;
      }
      // The component owns the countdown; changing count-down restarts its ring.
      state.timer = component._lastSecond === null ? component.data.countDown : component._lastSecond;
      setMetric('#timerMetric', `Timer ${state.timer}s`);
      if (component._finished) {
        const duration = component.data.countDown;
        // Reset only after a full cycle. Reapplying an unchanged duration is a no-op.
        timer.setAttribute('count-down', 0);
        timer.setAttribute('count-down', duration);
      }
    }

    window.onPrimaryClick = onPrimaryClick;
    window.onBevelClick = onBevelClick;
    window.onIconClick = onIconClick;
    window.onIconLabelClick = onIconLabelClick;
    window.onToggle = onToggle;
    window.onRadioComfort = onRadioComfort;
    window.onRadioFocus = onRadioFocus;
    window.onInputClick = onInputClick;
    window.onSlide = onSlide;
    window.onVerticalSlide = onVerticalSlide;
    window.formatPercent = formatPercent;
    window.cycleProgress = cycleProgress;

    window.addEventListener('load', function () {
      setInterval(tickTimer, 1000);
      setInterval(cycleProgress, 2400);

      const input = document.querySelector('#demoInput');
      if (input) {
        input.addEventListener('input', onInputEdit);
        input.addEventListener('change', onInputCommit);
      }
      const scene = document.querySelector('a-scene');
      const cursor = document.querySelector('#cursor');
      const setPointerMode = function (immersive) {
        cursor.setAttribute('cursor', 'rayOrigin', immersive ? 'entity' : 'mouse');
        cursor.setAttribute('visible', immersive);
      };
      setPointerMode(false);
      scene.addEventListener('enter-vr', () => setPointerMode(true));
      scene.addEventListener('exit-vr', () => setPointerMode(false));
      document.querySelector('#gazeMode').addEventListener('change', function (event) {
        cursor.setAttribute('cursor', 'fuse', event.target.checked);
        cursor.setAttribute('cursor', 'rayOrigin', event.target.checked ? 'entity' : 'mouse');
        cursor.setAttribute('visible', event.target.checked);
      });
    });
  </script>
</head>
<body>
  <label class="gaze-setting">
    <input id="gazeMode" type="checkbox"> Gaze selection <span class="desktop-hint">Click or Tab to explore</span>
  </label>
  <a-scene glass-showcase background="color: #080D1C">
    <a-entity geometry="primitive: plane; width: 26; height: 15"
      material="shader: showcase-atmosphere; depthWrite: false"
      position="0 1.7 -2"></a-entity>

    <a-entity id="rig" position="0 1.6 4.4">
      <a-camera look-controls wasd-controls>
        <a-sxr-cursor id="cursor"
          raycaster="objects: [sxr-interactable]"
          fuse="false"
          color="#F1F5F9"
          hover-color="#73BBFF"
          active-color="#0A84FF"
          design="ring"
          position="0 0 -1">
        </a-sxr-cursor>
      </a-camera>
      <a-entity laser-controls="hand: left" raycaster="objects: [sxr-interactable]"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: [sxr-interactable]"></a-entity>
    </a-entity>

    <a-sxr-flex-container
      id="heroPanel"
      flex-direction="column"
      justify-content="center"
      align-items="center"
      opacity="0.26"
      width="3.45"
      height="4.75"
      is-top-container="true"
      panel-color="#7C91B8"
      panel-rounded="0.26"
      position="-3.7 1.7 0">

      <a-sxr-label width="3.05" height="0.48"
        value="SenangStart XR"
        font-color="#ffffff"
        background-color="#25334F"
        opacity="0"
        font-size="0.30"
        text-depth="0.08"
        text-stroke-width="0"
        margin="0.03 0 0.04 0"></a-sxr-label>

      <a-sxr-label width="3.05" height="0.62"
        value="3D GUI primitives for A-Frame. Desktop: click or Tab to a widget — Enter/Space activate, arrows adjust sliders, 'b' presses the primary button."
        font-color="#ffffff"
        background-color="#25334F"
        opacity="0"
        font-size="0.135"
        line-height="0.19"
        text-depth="0.08"
        text-stroke-width="0"
        margin="0.02 0 0.08 0"></a-sxr-label>

      <a-sxr-button width="2.8" height="0.54"
        value="Glass Button"
        radius="0.12"
        onclick="onPrimaryClick"
        key="b"
        font-color="#F1F5F9"
        border-color="#657592"
        background-color="#25334F"
        hover-color="#73BBFF"
        active-color="#0A84FF"
        margin="0.06 0 0.06 0"></a-sxr-button>

      <a-sxr-button width="2.8" height="0.58"
        value="Primary Action"
        radius="0.16"
        onclick="onBevelClick"
        bevel="true"
        bevel-size="0.012"
        bevel-thickness="0.018"
        base-depth="0.012"
        depth="0.045"
        gap="0.025"
        border-color="#73BBFF"
        background-color="#0A84FF"
        hover-color="#73BBFF"
        active-color="#F1F5F9"
        font-color="#F1F5F9"
        margin="0.06 0 0.07 0"></a-sxr-button>

      <a-sxr-input id="demoInput"
        width="2.8"
        height="0.5"
        value="Interactive input"
        native-editing="true"
        onclick="onInputClick"
        background-color="#25334F"
        border-color="#0A84FF"
        border-hover-color="#73BBFF"
        hover-color="#344766"
        font-color="#F1F5F9"
        font-size="0.16"
        margin="0.07 0 0.07 0"></a-sxr-input>

      <a-sxr-label id="statusText"
        width="2.8"
        height="0.72"
        value="Aim at widgets and click to update this live status readout."
        align="left"
        anchor="left"
        font-color="#F1F5F9"
        background-color="#101B30"
        opacity="0.28"
        font-size="0.135"
        line-height="0.19"
        text-depth="0.03"
        margin="0.08 0 0.02 0"></a-sxr-label>

      <a-sxr-label id="clickMetric" width="2.8" height="0.28"
        value="Clicks 0"
        font-color="#F1F5F9" font-size="0.13" line-height="0.17"
        opacity="0" margin="0.04 0 0 0"></a-sxr-label>
    </a-sxr-flex-container>

    <a-sxr-flex-container
      id="controlsPanel"
      flex-direction="column"
      justify-content="center"
      align-items="center"
      opacity="0.26"
      width="3.55"
      height="4.75"
      is-top-container="true"
      panel-color="#7C91B8"
      panel-rounded="0.26"
      position="0 1.7 0">

      <a-sxr-label width="3.1" height="0.38"
        value="Controls"
        font-color="#F1F5F9"
        background-color="#25334F"
        opacity="0"
        font-size="0.25"
        margin="0.02 0 0.05 0"></a-sxr-label>

      <a-sxr-flex-container
        flex-direction="row"
        justify-content="center"
        align-items="center"
        width="3.05"
        height="0.72"
        opacity="0"
        margin="0.04 0 0.06 0">

        <a-sxr-icon-button width="0.58" height="0.58"
          onclick="onIconClick"
          icon="cog-6-tooth"
          icon-font-size="0.32"
          border-color="#657592"
          background-color="#25334F"
          hover-color="#73BBFF"
          active-color="#0A84FF"
          margin="0 0.08 0 0"></a-sxr-icon-button>

        <a-sxr-icon-button width="0.58" height="0.58"
          onclick="onIconClick"
          icon="play"
          icon-font-size="0.32"
          border-color="#657592"
          background-color="#25334F"
          hover-color="#73BBFF"
          active-color="#0A84FF"
          margin="0 0.08 0 0.08"></a-sxr-icon-button>

        <a-sxr-icon-button width="0.58" height="0.58"
          onclick="onIconClick"
          icon="star"
          icon-font-size="0.32"
          toggle="true"
          border-color="#73BBFF"
          background-color="#25334F"
          hover-color="#73BBFF"
          active-color="#0A84FF"
          margin="0 0 0 0.08"></a-sxr-icon-button>
      </a-sxr-flex-container>

      <a-sxr-icon-label-button width="2.9" height="0.52"
        onclick="onIconLabelClick"
        icon="sparkles"
        icon-font-size="0.26"
        value="Icon + Label Button"
        font-size="0.145"
        border-color="#73BBFF"
        background-color="#25334F"
        hover-color="#73BBFF"
        active-color="#0A84FF"
        margin="0.04 0 0.06 0"></a-sxr-icon-label-button>

      <a-sxr-toggle width="2.9" height="0.48"
        value="Toggle inspect mode"
        onclick="onToggle"
        key="t"
        font-size="0.15"
        font-color="#F1F5F9"
        background-color="#F1F5F9"
        border-color="#657592"
        hover-color="#73BBFF"
        active-color="#0A84FF"
        handle-color="#F1F5F9"
        margin="0.06 0 0.06 0"></a-sxr-toggle>

      <a-sxr-flex-container
        id="viewModeGroup"
        role="radiogroup"
        aria-label="View mode — choose one"
        flex-direction="column"
        justify-content="center"
        align-items="center"
        width="3.05"
        height="1.4"
        opacity="0"
        margin="0.04 0 0.04 0">

        <a-sxr-label width="2.9" height="0.24"
          value="View mode: choose one (arrow keys)"
          font-color="#F1F5F9"
          font-size="0.12"
          opacity="0"
          margin="0 0 0.04 0"></a-sxr-label>

        <a-sxr-radio id="radioComfort" width="2.9" height="0.48"
          group="view-mode"
          checked="true"
          value="Comfort"
          onclick="onRadioComfort"
          font-size="0.15"
          font-color="#F1F5F9"
          background-color="#F1F5F9"
          border-color="#657592"
          hover-color="#73BBFF"
          active-color="#0A84FF"
          margin="0.02 0 0.02 0"></a-sxr-radio>

        <a-sxr-radio id="radioFocus" width="2.9" height="0.48"
          group="view-mode"
          value="Focus"
          onclick="onRadioFocus"
          font-size="0.15"
          font-color="#F1F5F9"
          background-color="#F1F5F9"
          border-color="#657592"
          hover-color="#73BBFF"
          active-color="#0A84FF"
          margin="0.02 0 0 0"></a-sxr-radio>
      </a-sxr-flex-container>

      <a-sxr-flex-container
        flex-direction="row" justify-content="center" align-items="center"
        width="3.05" height="0.34" item-padding="0.12" opacity="0"
        margin="0.04 0 0.02 0">
        <a-sxr-label id="modeMetric" width="1.4" height="0.3"
          value="Mode Orbit" font-size="0.12" line-height="0.16"
          font-color="#F1F5F9" opacity="0"></a-sxr-label>
        <a-sxr-label id="radioMetric" width="1.4" height="0.3"
          value="Comfort selected" font-size="0.12" line-height="0.16"
          font-color="#F1F5F9" opacity="0"></a-sxr-label>
      </a-sxr-flex-container>
    </a-sxr-flex-container>

    <a-sxr-flex-container
      id="metersPanel"
      flex-direction="column"
      justify-content="center"
      align-items="center"
      item-padding="0.08"
      opacity="0.26"
      width="3.65"
      height="4.75"
      is-top-container="true"
      panel-color="#7C91B8"
      panel-rounded="0.26"
      position="3.75 1.7 0">

      <a-sxr-label width="3.1" height="0.38"
        value="Meters + Sliders"
        font-color="#F1F5F9" font-size="0.25"
        opacity="0"></a-sxr-label>

      <!-- Each meter has its own caption, directly above the control. -->
      <a-sxr-flex-container
        flex-direction="row" justify-content="center" align-items="center"
        width="3.1" height="1.22" item-padding="0.24" opacity="0">

        <a-sxr-flex-container
          flex-direction="column" justify-content="center" align-items="center"
          width="1.3" height="1.22" item-padding="0.06" opacity="0">
          <a-sxr-label width="1.3" height="0.28"
            value="Loading (%)" font-color="#F1F5F9"
            font-size="0.13" line-height="0.17" opacity="0"></a-sxr-label>
          <a-sxr-circle-loader id="circleLoader"
            width="0.8" height="0.8" loaded="0.64"
            active-color="#0A84FF" background-color="#101B30"
            font-color="#F1F5F9" font-size="0.2"></a-sxr-circle-loader>
        </a-sxr-flex-container>

        <a-sxr-flex-container
          flex-direction="column" justify-content="center" align-items="center"
          width="1.3" height="1.22" item-padding="0.06" opacity="0">
          <a-sxr-label id="timerMetric" width="1.3" height="0.28"
            value="Timer 12s" font-color="#F1F5F9"
            font-size="0.13" line-height="0.17" opacity="0"></a-sxr-label>
          <a-sxr-circle-timer id="circleTimer"
            width="0.8" height="0.8" count-down="12"
            active-color="#73BBFF" border-color="#657592"
            background-color="#101B30" font-color="#F1F5F9"
            font-size="0.2"></a-sxr-circle-timer>
        </a-sxr-flex-container>
      </a-sxr-flex-container>

      <a-sxr-flex-container
        flex-direction="column" justify-content="center" align-items="center"
        width="3.1" height="0.5" item-padding="0.04" opacity="0">
        <a-sxr-label id="progressMetric" width="3.1" height="0.28"
          value="Progress 64%" font-color="#F1F5F9"
          font-size="0.13" line-height="0.17" opacity="0"></a-sxr-label>
        <a-sxr-progressbar id="linearProgress"
          width="2.9" height="0.14" percent="0.64"
          background-color="#101B30" active-color="#0A84FF"></a-sxr-progressbar>
      </a-sxr-flex-container>

      <a-sxr-flex-container
        flex-direction="column" justify-content="center" align-items="center"
        width="3.1" height="0.66" item-padding="0.04" opacity="0">
        <a-sxr-label id="sliderMetric" width="3.1" height="0.28"
          value="Horizontal 42%" font-color="#F1F5F9"
          font-size="0.13" line-height="0.17" opacity="0"></a-sxr-label>
        <a-sxr-slider width="2.9" height="0.32"
          percent="0.42" onclick="onSlide"
          background-color="#25334F" border-color="#657592"
          active-color="#0A84FF" handle-color="#F1F5F9"
          hover-color="#73BBFF"></a-sxr-slider>
      </a-sxr-flex-container>

      <!-- Reserve the full row for the slider and its moving value/hover bubbles. -->
      <a-sxr-flex-container
        flex-direction="column" justify-content="center" align-items="center"
        width="3.1" height="1.48" item-padding="0.06" opacity="0">
        <a-sxr-label id="verticalMetric" width="3.1" height="0.28"
          value="Vertical 68%" font-color="#F1F5F9"
          font-size="0.13" line-height="0.17" opacity="0"></a-sxr-label>
        <a-sxr-vertical-slider width="0.56" height="1.12"
          percent="0.68" onclick="onVerticalSlide"
          output-function="formatPercent"
          output-width="0.7" output-font-size="0.14" output-text-depth="0.03"
          hover-font-size="0.12"
          active-color="#0A84FF" background-color="#101B30"
          border-color="#657592" handle-color="#F1F5F9"
          hover-color="#73BBFF" opacity="0.9"></a-sxr-vertical-slider>
      </a-sxr-flex-container>
    </a-sxr-flex-container>

    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; intensity: 0.75" position="2 4 3"></a-entity>
    <a-entity light="type: point; intensity: 0.55; color: #0A84FF" position="-3 2.8 1.5"></a-entity>
  </a-scene>
</body>
</html>
